name: untitled2
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  get: ^4.7.2
  get_it: ^8.0.3
  equatable: ^2.0.7

  # HTTP & DI
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  injectable: ^2.3.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.5

  # Animation & UI
  lottie: ^3.3.1
  google_nav_bar: ^5.0.7
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  dropdown_button2: ^2.3.9

  # JSON
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.5.4
  json_serializable: ^6.9.0
  retrofit_generator: ^8.1.0
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1
  flutter_lints: ^5.0.0
  carousel_slider_plus: ^7.1.1
  badges: ^3.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/category_images/
    - assets/images/home_images/
    - assets/icons/
  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
